# Sveltia CMS 配置（兼容 Decap/Netlify CMS 配置格式）
# OAuth 代理（Cloudflare Worker）地址需在部署后替换 base_url（工程规格书 §6.2）。
#
# 部署步骤：
#   1. 创建 GitHub OAuth App，Authorization callback URL 指向
#      https://<your-oauth-worker>.workers.dev/callback
#   2. 部署 OAuth Worker，配置 GITHUB_OAUTH_CLIENT_ID / GITHUB_OAUTH_CLIENT_SECRET
#   3. 将下方 base_url 替换为 Worker 域名

backend:
  name: github
  repo: ydc1024/read
  branch: main
  base_url: https://auth.aicopy.work
  commit_messages:
    create: 'publish: {{slug}}'
    update: 'update: {{slug}}'
    delete: 'delete: {{slug}}'

site_url: https://jscloud.aicopy.work
display_url: https://jscloud.aicopy.work
logo_url: https://jscloud.aicopy.work/favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

publish_mode: editorial_workflow

collections:
  - name: units
    label: 内容单元
    label_singular: 内容单元
    description: GEO 内容单元，问题式标题 + 结构化答案 + 实体标注
    folder: src/content/units
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}}（{{scenario}} / {{status}}）'
    sortable_fields: [pubDate, title]
    fields:
      - { label: 标题（问题式）, name: title, widget: string }
      - { label: 描述, name: description, widget: text }
      - { label: 标准化答案摘要, name: answerSummary, widget: text }
      - { label: 发布日期, name: pubDate, widget: date, format: 'YYYY-MM-DD' }
      - { label: 更新日期, name: updatedDate, widget: date, format: 'YYYY-MM-DD', required: false }
      - label: 业务场景
        name: scenario
        widget: select
        options:
          - { label: 外贸SOHO与跨境办公, value: foreign-trade }
          - { label: 跨境电商与多账号运营, value: cross-border-ecommerce }
          - { label: 海外AI平台使用, value: overseas-ai }
          - { label: 流媒体与内容消费, value: streaming }
          - { label: 海外社媒运营与矩阵营销, value: social-media }
      - label: 搜索意图
        name: intent
        widget: select
        options:
          - { label: 信息型, value: informational }
          - { label: 商业型, value: commercial }
          - { label: 导航型, value: navigational }
          - { label: 交易型, value: transactional }
      - label: 内容状态
        name: status
        widget: select
        default: pending_review
        options:
          - { label: 草稿, value: draft }
          - { label: 待审核, value: pending_review }
          - { label: 已批准, value: approved }
          - { label: 已发布, value: published }
      - label: 主 Schema 类型
        name: schemaType
        widget: select
        default: FAQPage
        options: [FAQPage, Article, HowTo]
      - label: 核心实体
        name: entities
        widget: list
        min: 1
        fields:
          - { label: 名称, name: name, widget: string }
          - label: 类型
            name: type
            widget: select
            options: [Organization, Product, Concept, Platform, Thing]
          - { label: 权威链接（sameAs）, name: sameAs, widget: string, required: false }
          - label: 关联实体
            name: relatedTo
            widget: list
            required: false
            field: { label: 实体名, name: name, widget: string }
          - { label: 品牌, name: brand, widget: string, required: false }
      - label: 常见问题
        name: faq
        widget: list
        required: false
        fields:
          - { label: 问题, name: question, widget: string }
          - { label: 答案, name: answer, widget: text }
      - label: 场景化结论（CTA）
        name: cta
        widget: object
        fields:
          - { label: 结论文本, name: text, widget: text }
          - { label: 跳转链接, name: link, widget: string, default: 'https://jscloud.aicopy.work/#products' }
      - { label: OG 图覆盖（可选）, name: ogImage, widget: string, required: false }
      - { label: GEO 评分, name: geoScore, widget: number, required: false, value_type: int, min: 0, max: 100 }
      - { label: AI 语气评分, name: aiToneScore, widget: number, required: false, value_type: int, min: 0, max: 100 }
      - label: 来源事实
        name: sourceFacts
        widget: list
        required: false
        fields:
          - { label: 事实陈述, name: statement, widget: text }
          - { label: 来源链接, name: sourceUrl, widget: string }
          - { label: 来源标题, name: sourceTitle, widget: string, required: false }
          - { label: 可信度(0-1), name: credibilityScore, widget: number, required: false, value_type: float, min: 0, max: 1, step: 0.1 }
          - label: 时效性
            name: freshness
            widget: select
            required: false
            options: [fresh, recent, stale]
      - { label: 正文, name: body, widget: markdown, required: false }
